[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "threadline-ml"
version = "0.1.0"
description = "Training and feature code for the Threadline fashion recommender"
requires-python = ">=3.10"
# Serving deps are pinned exactly: the ranker is pickled at training time and must be
# unpickled with the same scikit-learn/NumPy in the inference image.
dependencies = [
  "numpy==2.4.4",
  "pandas==3.0.2",
  "pyarrow==25.0.1",
  "scikit-learn==1.8.0",
  "joblib==1.5.3",
]

[project.optional-dependencies]
train = [
  "torch==2.14.0",
  "tensorflow-cpu==2.21.0; platform_machine != 'arm64'",
  "tensorflow==2.21.0; platform_machine == 'arm64'",
  "mlflow==3.16.1",
  "faiss-cpu==1.15.1",
]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["threadline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "B905"]
